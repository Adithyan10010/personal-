<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<title>Iron Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 42 13.5v21L24 45 6 34.5v-21z' fill='%230a0c0f' stroke='%235bc0ff' stroke-width='3'/%3E%3Cg fill='%235bc0ff'%3E%3Crect x='15' y='22.5' width='18' height='3'/%3E%3Crect x='11' y='17' width='4' height='14'/%3E%3Crect x='33' y='17' width='4' height='14'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0a0c0f;--card:#12161b;--ink:#e6ebf1;--mut:#7d8a99;--acc:#5bc0ff;--cy:#ff7a45;--line:#222a33;--ok:#34d399;--mid:#fbbf24;--bad:#f43f5e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(66px + env(safe-area-inset-bottom));min-height:100vh}
body:before{content:"";position:fixed;inset:-6%;z-index:-1;background:radial-gradient(500px 360px at 80% 0,#5bc0ff24,transparent 70%),radial-gradient(420px 320px at 0 100%,#ff7a4516,transparent 70%),linear-gradient(#ffffff07 1px,transparent 1px) 0 0/100% 38px;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-2%,2%) scale(1.05)}}
main{max-width:640px;margin:0 auto;padding:10px}
h2,h3{font-family:'Saira Semi Condensed','Arial Narrow',sans-serif;margin:0 0 8px;font-weight:700;letter-spacing:.4px}
h2{font-size:24px}h3{font-size:19px}
.view>*{animation:in .55s cubic-bezier(.2,.8,.2,1) backwards}
.view>:nth-child(2){animation-delay:.06s}.view>:nth-child(3){animation-delay:.12s}.view>:nth-child(4){animation-delay:.18s}.view>:nth-child(5){animation-delay:.24s}.view>:nth-child(n+6){animation-delay:.3s}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px;margin:0 0 9px;box-shadow:inset 0 1px 0 #ffffff0d}
.mut{color:var(--mut);font-size:13px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #5bc0ff2e}
textarea{min-height:300px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;margin:0 0 8px}.row>*{flex:1;min-width:0}
.set{display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;align-items:center;margin:0 0 6px}
.set b{color:var(--acc);font-family:'Saira Semi Condensed'}
button{border:0;background:var(--acc);color:#04121c;padding:11px 16px;border-radius:6px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .25s}
button:active{transform:scale(.95)}button:hover{box-shadow:0 0 18px #5bc0ff66}
button.alt{background:transparent;color:var(--acc);border:1px solid #5bc0ff80}
button.x{background:none;color:var(--bad);padding:2px 8px;flex:0;box-shadow:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a0c0fee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:13px 2px;font-size:13px;box-shadow:none;transition:color .25s}
nav button.on{color:var(--acc)}
.ind{position:absolute;top:-1px;width:16.667%;height:2px;background:var(--acc);box-shadow:0 0 14px var(--acc);transition:left .4s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-block;padding:4px 11px;border-radius:4px;font-size:13px;font-weight:700;color:#04121c;margin:0 6px 6px 0;animation:pop .45s backwards}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.ok{background:var(--ok)}.mid{background:var(--mid)}.bad{background:var(--bad)}
.big{font:700 44px/1 'Saira Semi Condensed',sans-serif}
.logo{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.logo svg{width:46px;height:46px;flex:none}
.logo .hx{stroke-dasharray:1;animation:dr 1.3s ease-out}
.logo .db{transform-box:fill-box;transform-origin:center;animation:pop .6s .6s backwards}
.wm{font:700 28px/1 'Saira Semi Condensed',sans-serif;letter-spacing:4px;color:transparent;background:linear-gradient(100deg,var(--ink) 40%,var(--acc) 50%,var(--ink) 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;animation:sheen 4.5s 1.2s ease-in-out infinite}
.wm span{font-weight:500}
@keyframes sheen{to{background-position:-150% 0}}
.flame{width:34px;height:34px;fill:var(--cy);vertical-align:-4px;animation:fl 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fl{50%{transform:scale(1.15) rotate(-5deg)}}
.ring{width:70px;height:70px;flex:0 0 70px}.ring circle{fill:none;stroke-width:7}.ring .rb{stroke:var(--line)}
.ring .rf{stroke-linecap:round;stroke-dasharray:var(--v) 100;transform:rotate(-90deg);transform-origin:40px 40px;animation:ring 1.3s cubic-bezier(.2,.8,.2,1)}
@keyframes ring{from{stroke-dasharray:0 100}}
.rf.ok{stroke:var(--ok)}.rf.mid{stroke:var(--mid)}.rf.bad{stroke:var(--bad)}
.ring text{font:700 26px 'Saira Semi Condensed';fill:var(--ink)}
.dots{display:flex;gap:6px;margin-top:12px}.dots i{flex:1;text-align:center;font-style:normal;font-size:12px;color:var(--mut)}
.dots i b{display:block;height:26px;border-radius:4px;background:var(--bg);border:1px solid var(--line);margin-bottom:2px}
.dots i.on b{background:var(--acc);border-color:var(--acc);box-shadow:0 0 12px #5bc0ff66;animation:pop .45s backwards}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--cy));animation:grow 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
svg{width:100%;height:auto;overflow:visible;font-size:11px;fill:var(--ink)}
svg .g{stroke:var(--line)}svg .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-dasharray:1;animation:dr 1.2s ease-out}
@keyframes dr{from{stroke-dashoffset:1}}
svg .bb{fill:var(--cy);opacity:.6;transform-box:fill-box;transform-origin:bottom;animation:up .8s ease-out}
@keyframes up{from{transform:scaleY(0)}}
svg .dt{fill:var(--acc)}svg .ax{fill:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.tag{font-size:11px;background:var(--bad);color:#04121c;border-radius:4px;padding:1px 6px;font-weight:700;margin-left:6px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--acc);color:#04121c;padding:10px 18px;border-radius:6px;font-weight:700;animation:in .3s;z-index:9;box-shadow:0 0 24px #5bc0ff66}
.sum{display:grid;grid-template-columns:36% 1fr;gap:12px;align-items:center}
.mr{display:grid;grid-template-columns:46px 1fr 64px;gap:6px;align-items:center;font-size:12px;margin:6px 0}
.mr b{text-align:right}.mr small{color:var(--mut);font-weight:500}.mr .bar{height:7px}
.bar i.cp{background:var(--acc)}.bar i.cc{background:var(--mid)}.bar i.cf{background:var(--cy)}.bar i.cj{background:#b58cff}.bar i.over{background:var(--bad)}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;background:var(--bg);color:var(--mut);border:1px solid var(--line);padding:7px}.seg button.on{background:var(--acc);color:#04121c;border-color:var(--acc)}
summary{cursor:pointer;font-weight:600}
.wk{display:flex;gap:6px;align-items:flex-end;height:112px}.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:11px;color:var(--mut)}
.wk i{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(var(--acc),#2f7de1);transform-origin:bottom;animation:up .8s ease-out}
.wn{color:var(--ok);font-weight:700;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.4}}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.ph{position:relative}.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block}
.ph span{position:absolute;left:4px;bottom:4px;font-size:11px;background:#000b;padding:1px 6px;border-radius:3px}
.ph .x{position:absolute;top:2px;right:2px;background:#000b;padding:0 7px}
.up{display:block;text-align:center;padding:9px;border:1px dashed #5bc0ff80;border-radius:6px;color:var(--acc);font-weight:700;cursor:pointer}
@media(prefers-reduced-motion:reduce){*,:before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const T=[['today','Train'],['food','Food'],['daily','Daily'],['goal','Goal'],['prog','Progress'],['more','More']];
const F=[["Roti / chapati (1)",100,3,18,2],["Rice, cooked (1 cup)",200,4,44,.5],["Dosa (1)",130,3,22,3],["Idli (1)",60,2,12,.3],["Appam (1)",120,2,25,1],["Puttu (1 piece)",200,4,42,1],["Oats (1 bowl)",150,5,27,3],["Dal (1 bowl)",150,9,20,4],["Egg, boiled (1)",78,6,.6,5],["Omelette, 2 eggs (1)",190,12,1,15],["Chicken curry (1 bowl)",250,24,6,14],["Grilled chicken, 100 g",165,31,0,3.6],["Fish curry (1 bowl)",200,22,5,10],["Paneer, 100 g",265,18,3,20],["Milk (1 glass)",150,8,12,8],["Curd (1 bowl)",100,6,8,5],["Banana (1)",105,1,27,.4],["Whey protein (1 scoop)",120,24,3,1.5],["Almonds (10)",70,2.5,2.5,6]];
const JK=[['pizza',285],['burger',300],['fries',365],['samosa',260],['chips',150],['chocolate',230],['ice cream',210],['cake',350],['cola',140],['soda',140],['noodles',380],['momos',200],['biscuit',50],['donut',250],['pastry',300],['vada',180],['pakoda',200],['sandwich',300],['shawarma',450],['fried chicken',320],['juice',120],['milkshake',350],['gulab jamun',150],['jalebi',150],['parotta',260],['biryani',450]];
const SH="Inclined lateral raises - Shoulders - 4\nDB shoulder press - Shoulders - 3\nRear delt flys - Shoulders - 3";
const DEF=`Day 1 Chest and Biceps
Flat DB press - Chest - 4
Incline chest press - Chest - 3
Cable fly + pushups - Chest - 3
Preacher curls - Biceps - 3
Hammer curls - Biceps - 3
Incline curl - Biceps - 2
Crunches - Abs - 3

Day 2 Back and Triceps
Close grip lat pulldown - Back - 4
Bent over rows - Back - 3
Low / mid row - Back - 3
Shrugs - Back - 3
Triceps pushdown - Triceps - 3
Overhead extension - Triceps - 3
Dips - Triceps - 2
Leg raises - Abs - 3

Day 3 Legs and Shoulder
Leg press - Legs - 3
Lunges (10 steps each) - Legs - 3
Leg extension - Legs - 2
Adductor - Legs - 3
Leg curls - Legs - 3
Calf raises - Calves - 3
${SH}

Day 4 Chest and Biceps
Incline DB press - Chest - 4
Flat bench - Chest - 4
Pec dec fly - Chest - 2
EZ bar curls - Biceps - 3
Rope hammer curls - Biceps - 3
Incline curl + drop set - Biceps - 2

Day 5 Back and Triceps
Straight arm pulldown - Back - 4
Dumbbell rows - Back - 3
One arm lat pulldown - Back - 2
Face pulls - Shoulders - 3
Triceps bar pushdown + drop set - Triceps - 3
Rope overhead extension - Triceps - 3
One arm pushdown - Triceps - 2

Day 6 Legs and Shoulder
Squats - Legs - 4
Bulgarian lunges - Legs - 3
Leg curls - Legs - 3
Abductors - Legs - 3
Calf raises - Calves - 3
${SH}`;
let D;try{D=JSON.parse(localStorage.getItem('ironlog'))}catch(e){}
D=D||{sets:[],sleep:[],food:[],me:{w:83,h:180,dob:'2005-09-19'},auto:false};
if(!D.plan||!D.v||D.v<2)D.plan=DEF;
if(D.v!=3){D.v=3;D.plan=D.plan.replace('Machine press - Chest','Incline DB press - Chest').replace(/Hyper extension - Back - 2\n/,'').replace(/Cable lateral raises/g,'Rear delt flys')}
if(D.v<4){D.v=4;D.plan=D.plan.replace('Seated chest press - Chest','Incline chest press - Chest').replace('Cable curls - Biceps','Incline curl - Biceps')}
D.me=D.me||{w:83,h:180};D.me.dob=D.me.dob||'2005-09-19';delete D.me.a;
Object.assign(D.me,{cal:D.me.cal||2800,start:D.me.start||83,goal:D.me.goal||75,sg:D.me.sg||7000});D.walk=D.walk||[];D.bw=D.bw||[];D.ph=D.ph||[];
const save=()=>{try{localStorage.setItem('ironlog',JSON.stringify(D))}catch(e){alert('Could not save. Check browser storage settings.')}};
const $=s=>document.querySelector(s),td=()=>new Date().toLocaleDateString('en-CA');
let tab='today',dayI=-1,cnt={},pEx='',pR=30;
const plan=()=>D.plan.split(/\n\s*\n/).map(b=>b.trim().split('\n')).filter(b=>b[0]).map(b=>({name:b[0].trim(),ex:b.slice(1).map(l=>{const p=l.split(' - ').map(s=>s.trim());return{n:p[0],m:p[1]||'Other',s:+p[2]||3}}).filter(e=>e.n)}));
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')};
function toast(m){const e=document.createElement('div');e.id='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function render(){
 const N=$('#nav');if(!N.firstChild)N.innerHTML=T.map(t=>`<button data-t="${t[0]}" onclick="tab='${t[0]}';render();scrollTo(0,0)">${t[1]}</button>`).join('')+'<i class="ind"></i>';
 N.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));N.querySelector('.ind').style.left=T.findIndex(t=>t[0]==tab)*100/T.length+'%';
 $('#app').innerHTML=`<div class="view">${({today,food,daily,goal,prog,more})[tab]()}</div>`;countUp()}

/* LOGO + COUNT-UP */
const logo=()=>`<div class="logo"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5e0ff"/><stop offset="1" stop-color="#2f7de1"/></linearGradient></defs><path class="hx" pathLength="1" d="M24 3 42 13.5v21L24 45 6 34.5v-21z" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round"/><g class="db" fill="url(#lg)"><rect x="15" y="22.5" width="18" height="3"/><rect x="11" y="17" width="4" height="14" rx="1"/><rect x="33" y="17" width="4" height="14" rx="1"/><rect x="7" y="20" width="3" height="8" rx="1"/><rect x="38" y="20" width="3" height="8" rx="1"/></g></svg><div><div class="wm">IRON<span>LOG</span></div><div class="mut">${new Date().toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'})}</div></div></div>`;
function countUp(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now(),f=t=>{const p=rm?1:Math.min(1,(t-t0)/900);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}

/* STREAK */
function streak(){
 const s=new Set([...D.sets,...D.sleep,...D.food,...D.walk,...D.bw,...D.ph].map(x=>x.date));let c=0,d=new Date();
 if(!s.has(td()))d.setDate(d.getDate()-1);
 while(s.has(d.toLocaleDateString('en-CA'))){c++;d.setDate(d.getDate()-1)}
 let b=0,r=0,p=null;[...s].sort().forEach(k=>{r=p&&days(p,k)==1?r+1:1;b=Math.max(b,r);p=k});
 const dots=[6,5,4,3,2,1,0].map(n=>{const k=ago(n);return`<i class="${s.has(k)?'on':''}"><b></b>${new Date(k).toLocaleDateString('en',{weekday:'narrow'})}</i>`}).join('');
 return`<div class="card"><div class="row"><div><span class="big"><svg class="flame" viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg> <span data-n="${c}">0</span></span><div class="mut">day streak · best ${b}</div></div><div class="mut">Any day you log a workout, sleep or food keeps the streak alive.</div></div><div class="dots">${dots}</div></div>`}

/* TRAIN */
function today(){
 const P=plan();let h=logo()+streak()+recovery();
 if(!P.length)return h+'<p>Add a plan first.</p>';
 if(dayI<0){const l=D.sets.slice().sort((a,b)=>a.date<b.date?1:-1)[0],i=l?P.findIndex(p=>p.name==l.day):-1;dayI=(i+1)%P.length}
 const d=$('#dt')?$('#dt').value:td();
 if(!D.food.some(f=>f.date==td()))h+=`<div class="card">What did you eat today? <button class="alt" onclick="tab='food';render()">Log food</button></div>`;
 h+=`<div class="row"><select onchange="dayI=this.selectedIndex;cnt={};render()">${P.map((p,i)=>`<option ${i==dayI?'selected':''}>${p.name}</option>`).join('')}</select><input type="date" id="dt" value="${d}" onchange="render()"></div>`;
 P[dayI].ex.forEach((e,i)=>{
  const hist=D.sets.filter(s=>s.ex==e.n&&s.date<d),ld=hist.length?hist.map(s=>s.date).sort().pop():null,last=hist.filter(s=>s.date==ld),cur=D.sets.filter(s=>s.ex==e.n&&s.date==d),n=cnt[e.n]||Math.max(e.s,cur.length);
  h+=`<div class="card"><h3>${e.n}</h3><div class="mut">${e.m}${ld?' · last '+ld+': '+last.map(s=>s.w+'×'+s.r).join(', '):''}</div><br>`;
  for(let j=0;j<n;j++){const c=cur.find(s=>s.set==j+1),l=last.find(s=>s.set==j+1);
   h+=`<div class="set"><b>${j+1}</b><input type="number" inputmode="decimal" id="w${i}_${j}" placeholder="${l?l.w+' kg':'kg'}" value="${c?c.w:''}"><input type="number" inputmode="numeric" id="r${i}_${j}" placeholder="${l?l.r+' reps':'reps'}" value="${c?c.r:''}"></div>`}
  h+=`<button class="alt" onclick="cnt['${e.n}']=${n+1};render()">Add set</button></div>`});
 return h+`<button style="width:100%" onclick="saveW()">Save workout</button>`}
function saveW(){
 const P=plan()[dayI],d=$('#dt').value;let k=0;
 P.ex.forEach((e,i)=>{D.sets=D.sets.filter(s=>!(s.ex==e.n&&s.date==d));
  for(let j=0;j<40;j++){const w=$(`#w${i}_${j}`);if(!w)break;if(w.value!==''){D.sets.push({date:d,day:P.name,ex:e.n,muscle:e.m,set:j+1,w:+w.value,r:+$(`#r${i}_${j}`).value||0});k++}}});
 save();cnt={};if(D.auto)exp();render();toast(k+' sets saved ✓')}

/* RECOVERY */
function recovery(){
 const t=td(),sl=D.sleep.slice().sort((a,b)=>a.date<b.date?1:-1)[0],sc=sl?Math.round((Math.min(sl.hrs/8,1)*.7+sl.q/5*.3)*100):null,last={};
 D.sets.forEach(s=>{if(!last[s.muscle]||s.date>last[s.muscle])last[s.muscle]=s.date});
 const ms=Object.entries(last).map(([m,d])=>{const n=days(d,t);return{m,n,s:n>=3?100:n==2?80:n==1?50:20}}).filter(x=>x.n<=7),mA=ms.length?ms.reduce((a,b)=>a+b.s,0)/ms.length:null,p=[sc,mA].filter(x=>x!==null),all=p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length):null,cl=v=>v>=75?'ok':v>=50?'mid':'bad';
 if(all===null)return`<div class="card"><h3>Recovery</h3><span class="mut">Log sleep and workouts to see your status.</span></div>`;
 return`<div class="card"><h3>Recovery</h3><div class="row"><svg class="ring" viewBox="0 0 80 80"><circle class="rb" cx="40" cy="40" r="34"/><circle class="rf ${cl(all)}" style="--v:${all}" cx="40" cy="40" r="34" pathLength="100"/><text x="40" y="48" text-anchor="middle">${all}</text></svg><div>${all>=75?'Ready to train hard':all>=50?'Train, but go lighter':'Rest or active recovery'}<div class="mut">Sleep ${sl?sl.hrs.toFixed(1)+' h':'not logged'}</div></div></div>`+ms.map(x=>`<span class="pill ${cl(x.s)}">${x.m} · ${x.n==0?'today':x.n+'d ago'}</span>`).join('')+`</div>`}

/* PLAN */
function planV(){return`<h2>Workout plan</h2><div class="card"><p class="mut">First line of a block is the day name. Then one line per exercise: <b>Name - Muscle - Sets</b>. Blank line between days.</p><textarea id="pl">${D.plan}</textarea><br><br><button onclick="D.plan=$('#pl').value;save();dayI=-1;toast('Plan saved ✓')">Save plan</button></div>`}

/* SLEEP */
function sleep(){
 const L=D.sleep.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,7);
 return`<h2>Sleep</h2><div class="card"><div class="row"><input type="date" id="sd" value="${td()}"></div><div class="row"><label class="mut">Bed<input type="time" id="sb" value="23:00"></label><label class="mut">Wake<input type="time" id="sw" value="06:30"></label></div><div class="row"><label class="mut">Quality (1 to 5)<select id="sq"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option></select></label></div><button onclick="addSleep()">Save sleep</button></div><div class="card"><h3>Last 7 nights</h3>${L.map(s=>`<div class="li"><span>${s.date}</span><span>${s.hrs.toFixed(1)} h · quality ${s.q}</span></div>`).join('')||'<span class="mut">Nothing logged yet.</span>'}</div>`}
function addSleep(){
 const[b,w]=[$('#sb').value,$('#sw').value].map(v=>+v.slice(0,2)*60+ +v.slice(3)),hrs=((w-b+1440)%1440)/60,date=$('#sd').value;
 D.sleep=D.sleep.filter(s=>s.date!=date);D.sleep.push({date,bed:$('#sb').value,wake:$('#sw').value,hrs,q:+$('#sq').value});save();render();toast('Sleep saved ✓')}

/* FOOD */
let fm='meal';
const G=n=>Math.round(n);
const age=()=>{const b=new Date(D.me.dob||'2005-09-19'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
function goals(){const m=D.me,bmr=10*m.w+6.25*m.h-5*age()+5,mt=Math.round(bmr*1.65),k=D.me.cal||Math.round(mt*.95/50)*50,p=Math.round(m.w*2.2),f=Math.round(m.w*.9);return{mt,k,p,f,c:Math.round((k-p*4-f*9)/4),j:Math.round(k*.1)}}
function sp(k,p,junk){if(p){const r=Math.max(0,k-4*p);return{p,c:r*.55/4,f:r*.45/9}}const a=junk?[.08,.5,.42]:[.2,.5,.3];return{p:k*a[0]/4,c:k*a[1]/4,f:k*a[2]/9}}
const mac=f=>f.p!=null?f:{...f,...sp(f.kcal,0,f.junk)};
const mrow=(l,v,t,c)=>`<div class="mr"><span>${l}</span><div class="bar"><i class="${c}" style="width:${Math.min(100,v/t*100)}%"></i></div><b>${G(v)}<small>/${G(t)}g</small></b></div>`;
function food(){
 const t=td(),L=D.food.filter(f=>f.date==t).map(mac),g=goals(),S=k=>L.reduce((a,b)=>a+(b[k]||0),0),tot=S('kcal'),jk=L.filter(f=>f.junk).reduce((a,b)=>a+b.kcal,0),left=g.k-tot,m=D.me;
 const inp={meal:`<div class="row"><select id="fi">${F.map((f,i)=>`<option value="${i}">${f[0]} · ${f[1]} kcal</option>`).join('')}</select><input type="number" id="fq" value="1" step="0.5" style="max-width:70px"></div><button onclick="addFood()">Add meal</button>`,
 own:`<div class="row"><input id="an" placeholder="Food"><input id="ak" type="number" placeholder="kcal"><input id="ap" type="number" placeholder="protein g"></div><button onclick="addJ(false)">Add food</button>`,
 junk:`<div class="row"><input id="an" placeholder="e.g. 2 pizza slices"><input id="ak" type="number" placeholder="kcal (label)"></div><div class="mut" style="margin-bottom:8px">No label? Leave kcal blank and I will guess.</div><button onclick="addJ(true)">Add junk</button>`}[fm];
 return`<div class="card sum"><div><div class="big"><span data-n="${tot}">0</span></div><div class="mut">of ${g.k} kcal</div><div class="bar" style="margin:6px 0 4px"><i class="${left<0?'over':'ck'}" style="width:${Math.min(100,tot/g.k*100)}%"></i></div><div class="mut">${left>=0?left+' left':-left+' over'}</div></div><div>${mrow('Protein',S('p'),g.p,'cp')}${mrow('Carbs',S('c'),g.c,'cc')}${mrow('Fats',S('f'),g.f,'cf')}${mrow('Junk',jk,g.j,jk>g.j?'over':'cj')}</div></div>
 <div class="card"><div class="seg">${[['meal','Meal'],['own','Own food'],['junk','Junk']].map(x=>`<button class="${fm==x[0]?'on':''}" onclick="fm='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${inp}</div>
 <div class="card"><h3>Today</h3>${L.map(f=>`<div class="li"><span>${f.name}${f.qty!=1?' × '+f.qty:''}${f.junk?'<span class="tag">junk</span>':''}<div class="mut">P ${G(f.p)} · C ${G(f.c)} · F ${G(f.f)}</div></span><span>${f.est?'~':''}${f.kcal}<button class="x" onclick="D.food.splice(${D.food.indexOf(D.food.find(x=>x.date==t&&x.name==f.name&&x.kcal==f.kcal))},1);save();render()">✕</button></span></div>`).join('')||'<span class="mut">Nothing logged yet.</span>'}</div>
 <details class="card"><summary>Your numbers · ${m.w} kg · ${m.h} cm · age ${age()}</summary><div class="row" style="margin-top:8px"><label class="mut">Weight kg<input type="number" value="${m.w}" onchange="D.me.w=+this.value||83;save();render()"></label><label class="mut">Height cm<input type="number" value="${m.h}" onchange="D.me.h=+this.value||180;save();render()"></label><label class="mut">Date of birth<input type="date" value="${m.dob}" onchange="D.me.dob=this.value||'2005-09-19';save();render()"></label></div><div class="row"><label class="mut">Daily calories<input type="number" value="${m.cal}" onchange="D.me.cal=+this.value||2800;save();render()"></label><label class="mut">Daily steps goal<input type="number" value="${m.sg}" onchange="D.me.sg=+this.value||7000;save();render()"></label></div><p class="mut">Fat loss while keeping muscle, 6 training days a week, male. Maintenance is about ${g.mt} kcal. Your target is ${g.k} kcal, a ${g.mt-g.k} kcal deficit, with protein ${g.p} g (2.2 g/kg), fats ${g.f} g (0.9 g/kg) and the rest as carbs. Junk is capped at 10% of calories. Your age is worked out from your date of birth.</p></details>`}
function addFood(){const f=F[+$('#fi').value],q=+$('#fq').value||1;D.food.push({date:td(),name:f[0],qty:q,kcal:Math.round(f[1]*q),p:+(f[2]*q).toFixed(1),c:+(f[3]*q).toFixed(1),f:+(f[4]*q).toFixed(1),junk:false,est:false});save();render();toast('Added ✓')}
function addJ(junk){
 const name=$('#an').value.trim();let kc=+$('#ak').value,est=false;if(!name)return toast('Enter a food name');
 if(!kc){const m=JK.find(j=>name.toLowerCase().includes(j[0])),q=+(name.match(/^\d+(\.\d+)?/)||[1])[0];kc=Math.round((m?m[1]:250)*q);est=true}
 const m=sp(kc,+($('#ap')?$('#ap').value:0)||0,junk);D.food.push({date:td(),name,qty:1,kcal:kc,p:G(m.p),c:G(m.c),f:G(m.f),junk,est});save();render();toast(est?'Added with a guessed '+kc+' kcal':'Added ✓')}

/* PROGRESS */
function prog(){
 const ex=[...new Set(D.sets.map(s=>s.ex))];
 if(!ex.length)return`<h2>Progress</h2><div class="card"><span class="mut">Save a workout to see each exercise here.</span></div>`;
 if(!ex.includes(pEx))pEx=ex[0];
 const from=ago(pR),g={};D.sets.filter(s=>s.ex==pEx&&s.date>=from).forEach(s=>(g[s.date]=g[s.date]||[]).push(s));
 const R=Object.keys(g).sort().map(k=>{const a=g[k];return[k,Math.max(...a.map(s=>s.w)),+(a.reduce((x,s)=>x+s.r,0)/a.length).toFixed(1),a]});
 const o=(v,l)=>`<option value="${v}" ${pR==v?'selected':''}>${l}</option>`,df=R.length>1?R[R.length-1][1]-R[0][1]:0;
 return`<h2>Progress</h2><div class="card"><select onchange="pEx=this.value;render()">${ex.map(e=>`<option ${e==pEx?'selected':''}>${e}</option>`).join('')}</select><div class="row" style="margin-top:8px"><select onchange="pR=+this.value;render()">${o(7,'This week')}${o(30,'This month')}${o(90,'3 months')}${o(365,'This year')}</select></div>
 <div class="mut"><span style="color:var(--acc)">━</span> Weight (kg, left) &nbsp; <span style="color:var(--cy)">▮</span> Average reps (right)</div>${chart(R)}${R.length>1?`<p><b>${df>=0?'+':''}${df} kg</b> top weight over this period</p>`:''}</div>
 <div class="card"><table><tr><th>Date</th><th>Sets (kg × reps)</th></tr>${R.slice().reverse().map(r=>`<tr><td>${r[0].slice(5)}</td><td>${r[3].map(s=>s.w+'×'+s.r).join(', ')}</td></tr>`).join('')||'<tr><td colspan=2 class=mut>No sets in this range.</td></tr>'}</table></div>`}
function chart(P){
 if(!P.length)return'<p class="mut">No sets in this range.</p>';
 const W=340,H=190,p=30,mw=Math.max(...P.map(a=>a[1]))*1.15||1,mr=Math.max(...P.map(a=>a[2]))*1.15||1,n=P.length,sw=(W-2*p)/n,x=i=>p+(i+.5)*sw,yw=v=>H-p-v/mw*(H-2*p),yr=v=>H-p-v/mr*(H-2*p),bw=Math.min(22,sw*.6),st=Math.ceil(n/8);
 return`<svg viewBox="0 0 ${W} ${H}">`+[0,.5,1].map(f=>`<line class="g" x1="${p}" x2="${W-p}" y1="${yw(mw/1.15*f)}" y2="${yw(mw/1.15*f)}"/><text class="ax" x="${p-4}" y="${yw(mw/1.15*f)+4}" text-anchor="end">${Math.round(mw/1.15*f)}</text><text class="ax" x="${W-p+4}" y="${yr(mr/1.15*f)+4}">${Math.round(mr/1.15*f)}</text>`).join('')+
 P.map((a,i)=>`<rect class="bb" x="${x(i)-bw/2}" y="${yr(a[2])}" width="${bw}" height="${H-p-yr(a[2])}" rx="3"/>`).join('')+
 `<polyline class="ln" pathLength="1" points="${P.map((a,i)=>x(i)+','+yw(a[1])).join(' ')}"/>`+
 P.map((a,i)=>`<circle class="dt" cx="${x(i)}" cy="${yw(a[1])}" r="4"/><text x="${x(i)}" y="${yw(a[1])-9}" text-anchor="middle">${a[1]}</text>${i%st?'':`<text class="ax" x="${x(i)}" y="${H-10}" text-anchor="middle">${a[0].slice(5)}</text>`}`).join('')+`</svg>`}

/* WALK */
const daily=()=>walk()+sleep(),more=()=>planV()+data();
function walk(){
 const t=td(),x=D.walk.find(w=>w.date==t),sg=D.me.sg,st=x?x.steps:0,n=new Date(),mi=n.getHours()*60+n.getMinutes(),now=mi>=990&&mi<=1050,
 wk=[6,5,4,3,2,1,0].map(i=>{const k=ago(i),w=D.walk.find(a=>a.date==k);return[k,w?w.steps:0]}),mx=Math.max(sg,...wk.map(a=>a[1]));
 return`<h2>Daily walk</h2><div class="card"><div class="row"><div><div class="big"><span data-n="${st}">0</span></div><div class="mut">of ${sg} steps · about ${Math.round(st*.0005*D.me.w)} kcal</div></div><div class="mut ${now?'wn':''}" style="text-align:right">${now?'Walk time now':'Planned 4:30 to 5:30 PM'}</div></div><div class="bar"><i style="width:${Math.min(100,st/sg*100)}%"></i></div></div>
 <div class="card"><div class="row"><input type="date" id="wd" value="${t}"><input type="number" id="ws" inputmode="numeric" placeholder="Steps" value="${x?x.steps:''}"></div><button onclick="addWalk()">Save steps</button></div>
 <div class="card"><h3>Last 7 days</h3><div class="wk">${wk.map(a=>`<div><i style="height:${Math.max(2,a[1]/mx*70)}px"></i><span>${a[0].slice(8)}</span><small>${a[1]?(a[1]/1000).toFixed(1)+'k':'-'}</small></div>`).join('')}</div></div>`}
function addWalk(){const d=$('#wd').value,st=+$('#ws').value;if(!st)return toast('Enter your steps');D.walk=D.walk.filter(w=>w.date!=d);D.walk.push({date:d,steps:st,mins:60});save();render();toast('Steps saved ✓')}

/* GOAL */
const curW=()=>{const b=D.bw.slice().sort((a,c)=>a.date<c.date?1:-1)[0];return b?b.kg:D.me.start};
function eta(){
 const g=goals(),cur=curW(),left=Math.max(0,cur-D.me.goal),def=Math.max(0,g.mt-g.k),w7=D.walk.filter(x=>x.date>=ago(6)),avg=w7.length?Math.round(w7.reduce((a,b)=>a+b.steps,0)/w7.length):D.me.sg,burn=Math.round(avg*.0005*cur),tot=def+burn;
 if(!left||tot<=0)return null;
 const dt=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toLocaleDateString('en',{day:'numeric',month:'short',year:'numeric'})},d=Math.ceil(left*7700/tot),dn=def>0?Math.ceil(left*7700/def):0;
 return{def,burn,avg,tot,d,dn,rate:(tot*7/7700).toFixed(2),dt:dt(d),dr:Math.round(d*1.2),dtr:dt(Math.round(d*1.2)),dtn:dn?dt(dn):''}}
function spark(B){
 if(B.length<2)return'';const W=320,H=90,p=14,v=B.map(b=>b.kg),mn=Math.min(...v,D.me.goal)-1,mx=Math.max(...v)+1,x=i=>p+i*(W-2*p)/(B.length-1),y=a=>H-p-(a-mn)/(mx-mn)*(H-2*p);
 return`<svg viewBox="0 0 ${W} ${H}"><line class="g" x1="${p}" x2="${W-p}" y1="${y(D.me.goal)}" y2="${y(D.me.goal)}" stroke-dasharray="4"/><polyline class="ln" pathLength="1" points="${B.map((b,i)=>x(i)+','+y(b.kg)).join(' ')}"/>${B.map((b,i)=>`<circle class="dt" cx="${x(i)}" cy="${y(b.kg)}" r="3.5"/>`).join('')}<text class="ax" x="${W-p}" y="${y(D.me.goal)-4}" text-anchor="end">goal ${D.me.goal} kg</text></svg>`}
function goal(){
 const m=D.me,cur=curW(),tot=m.start-m.goal,done=Math.max(0,Math.min(tot,m.start-cur)),pc=tot>0?done/tot*100:0,left=Math.max(0,cur-m.goal),e=eta(),B=D.bw.slice().sort((a,b)=>a.date>b.date?1:-1),P=D.ph;
 return`<h2>My goal</h2><div class="card"><div class="row"><div><div class="big">${cur}<span class="mut" style="font:600 15px Manrope"> kg now</span></div></div><div class="mut" style="text-align:right">Start ${m.start} kg<br>Goal ${m.goal} kg</div></div><div class="bar" style="height:12px"><i style="width:${pc}%"></i></div><div class="mut" style="margin-top:6px">${done.toFixed(1)} of ${tot} kg lost · ${left.toFixed(1)} kg to go · ${Math.round(pc)}%</div></div>
 <div class="card"><h3>When will I get there?</h3>${e?`<div class="row"><div class="big"><span data-n="${e.d}">0</span><span class="mut" style="font:600 15px Manrope"> days</span></div><div class="mut">about ${Math.round(e.d/7)} weeks<br>around ${e.dt}</div></div><div class="mut">Your ${goals().k} kcal is ${e.def} kcal under maintenance. Walking about ${e.avg} steps adds roughly ${e.burn} kcal. That is ${e.tot} kcal a day, about ${e.rate} kg a week. Allow about ${e.dr} days (${e.dtr}) in practice, because your needs drop as you get lighter. Without the walk it would take about ${e.dn} days (${e.dtn}).</div>`:'<div class="mut">Goal reached, or your calories are not below maintenance.</div>'}</div>
 <div class="card"><h3>Log weight</h3><div class="row"><input type="date" id="bd" value="${td()}"><input type="number" id="bk" step="0.1" inputmode="decimal" placeholder="kg"></div><button onclick="addW()">Save weight</button>${spark(B)}${B.slice(-4).reverse().map(b=>`<div class="li"><span>${b.date}</span><span>${b.kg} kg <button class="x" onclick="D.bw.splice(D.bw.indexOf(D.bw.find(z=>z.date=='${b.date}')),1);save();render()">✕</button></span></div>`).join('')}</div>
 <div class="card"><h3>Progress photos</h3>${P.length>1?`<div class="cmp"><div class="ph"><img src="${P[0].img}"><span>Start ${P[0].date.slice(5)}</span></div><div class="ph"><img src="${P[P.length-1].img}"><span>Now ${P[P.length-1].date.slice(5)}</span></div></div>`:''}<label class="up">Add today's photo<input type="file" accept="image/*" onchange="addPhoto(this.files[0])" hidden></label><div class="gal">${P.slice().reverse().map(p=>`<div class="ph"><img src="${p.img}"><span>${p.date.slice(5)}</span><button class="x" onclick="D.ph.splice(${P.indexOf(p)},1);save();render()">✕</button></div>`).join('')}</div></div>
 <details class="card"><summary>Change goal</summary><div class="row" style="margin-top:8px"><label class="mut">Start kg<input type="number" value="${m.start}" onchange="D.me.start=+this.value||83;save();render()"></label><label class="mut">Goal kg<input type="number" value="${m.goal}" onchange="D.me.goal=+this.value||75;save();render()"></label></div></details>`}
function addW(){const d=$('#bd').value,k=+$('#bk').value;if(!k)return toast('Enter your weight');D.bw=D.bw.filter(b=>b.date!=d);D.bw.push({date:d,kg:k});D.me.w=curW();save();render();toast('Weight saved ✓')}
function addPhoto(f){
 if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.ph.push({date:td(),img:c.toDataURL('image/jpeg',.65)});save();render();toast('Photo saved ✓')};im.src=e.target.result};r.readAsDataURL(f)}

/* DATA */
function data(){return`<h2>Your data</h2><div class="card"><p class="mut">Everything saves in this browser automatically. Progress photos stay in the browser only and are not in the Excel file. The Excel file is your backup and your spreadsheet copy. A web page cannot write to a file on your phone silently, so turn on auto-download below and a fresh Excel file downloads every time you save a workout.</p><button onclick="exp()">Download Excel now</button><div class="row" style="margin-top:14px"><label><input type="checkbox" style="width:auto" ${D.auto?'checked':''} onchange="D.auto=this.checked;save()"> Download Excel after every workout save</label></div><br><label class="mut">Import from Excel<input type="file" accept=".xlsx" onchange="imp(this.files[0])"></label></div>`}
function exp(){
 const wb=XLSX.utils.book_new(),A=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n);
 A('Sets',D.sets);A('Sleep',D.sleep);A('Food',D.food);A('Plan',D.plan.split('\n').map(l=>({line:l})));A('Walk',D.walk);A('Weight',D.bw);A('Settings',[D.me]);
 XLSX.writeFile(wb,'iron-log-'+td()+'.xlsx')}
function imp(f){
 if(!f)return;const r=new FileReader();r.onload=e=>{
  const wb=XLSX.read(e.target.result,{type:'array'}),S=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n]):null,s=S('Sets'),sl=S('Sleep'),fo=S('Food'),pl=S('Plan'),se=S('Settings');
  if(!s)return alert('This file has no Sets sheet.');
  if(!confirm('Replace the data in this app with the file?'))return;
  D={v:2,auto:D.auto,walk:S('Walk')||[],bw:S('Weight')||[],ph:D.ph||[],sets:s,sleep:sl||[],food:fo||[],plan:pl?pl.map(x=>x.line||'').join('\n'):D.plan,me:se&&se[0]&&se[0].w?se[0]:D.me};
  save();render();toast('Imported ✓')};
 r.readAsArrayBuffer(f)}
render();
</script>
</body>
